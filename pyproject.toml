[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gtfs-terminals"
version = "0.1.0"
description = "Find transit terminals in GTFS feeds and link places to the nearest one."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Samuel Aguda" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=12",
    "scipy>=1.10",
]

[project.optional-dependencies]
geo = ["reverse_geocoder>=1.5"]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
gtfs-terminals = "gtfs_terminals.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY", "PD002"]

[tool.pytest.ini_options]
testpaths = ["tests"]
